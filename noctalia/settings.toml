config_version = 12

[accessibility]
ui_scale = 1.2500000111758709

[bar.default]
center = [ "cat_2", "clock" ]
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
scale = 1.1000000089406967
start = [ "control-center", "wallpaper", "workspaces", "media" ]
widget_spacing = 12

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "noctalia/bongocat" ]

[theme]
builtin = "Kanagawa"
community_palette = "Kanagawa Dragon"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "helix",
        "hyprland",
        "kcolorscheme",
        "kitty",
        "labwc",
        "mango",
        "niri",
        "qt",
        "scroll",
        "starship",
        "sway",
        "wezterm"
    ]
    community_ids = [
        "antigravity",
        "spicetify",
        "zen-browser",
        "discord",
        "telegram",
        "driftwm",
        "blender",
        "neovim",
        "vscode",
        "zed",
        "heroiclauncher",
        "steam",
        "rofi",
        "vicinae",
        "obs",
        "rio",
        "yazi"
    ]

[wallpaper]
directory = "/home/divy/Pictures"

    [wallpaper.default]
    path = "/home/divy/Pictures/ALLqk82.png"

    [wallpaper.last]
    path = "/home/divy/Pictures/ALLqk82.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/divy/Pictures/ALLqk82.png"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.cat_2]
type = "noctalia/bongocat:cat"